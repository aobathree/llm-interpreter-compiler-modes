[package]
name = "lambda-brief"
version = "0.1.0"
edition = "2021"

[dependencies]
brief-core = { path = "../brief-core" }
lambda_runtime = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
ureq = { workspace = true }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
